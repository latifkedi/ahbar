[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/engine",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CebrailCalim <cebrailcalimresmi@gmail.com>"]
license = "MIT"
repository = "https://github.com/latifkedi/ahbar"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
feed-rs = "2.1"
scraper = "0.20"
regex = "1.11"
